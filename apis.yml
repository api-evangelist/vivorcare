aid: vivorcare
name: VivorCare
description: OncoveryCare (VivorCare) is the first virtual survivorship clinic for people living
  with and beyond cancer. Backed by Techstars, the company pairs survivorship-trained care teams
  with a virtual-first platform delivering physical and mental health support, personalized
  survivorship care planning, patient navigation to community resources and referrals, and survivor
  education. It partners with oncology providers such as New York Cancer & Blood Specialists (NYCBS)
  to extend post-treatment care. OncoveryCare operates a public website and blog but currently
  publishes no public developer API, developer portal, or API documentation.
